# Render Blueprint for CodeLens AI.
# One web service (FastAPI + built React frontend, same origin) and one
# managed PostgreSQL database. Deploy: Render Dashboard -> New ->
# Blueprint -> connect the GitHub repo that contains this file.
#
# NOTE: Render's free PostgreSQL expires 30 days after creation.
# For a permanent free database, create one on Neon instead and set
# DATABASE_URL on the web service manually (delete the `databases:`
# block and the `fromDatabase` reference below in that case).

databases:
  - name: codelens-db
    databaseName: codelens
    plan: free

services:
  - type: web
    name: codelens-ai
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && cd frontend && npm ci && npm run build"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: codelens-db
          property: connectionString
      # Set these in the dashboard (never commit real keys):
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
